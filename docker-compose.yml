services:
  postgres:
    # Must match the major version of the data in postgres_data; changing it requires a dump/restore.
    # Since PG18 the image keeps its data under /var/lib/postgresql/<major>/.
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"
  keycloak:
    build:
      context: keycloak
      dockerfile: Dockerfile
    environment:
      # Either set KC_HOSTNAME to pin a single public URL, or leave it empty and set KC_HOSTNAME_STRICT=false
      # to answer on whichever hostname the proxy forwards.
      KC_HOSTNAME: ${KC_HOSTNAME:-}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-true}
      KC_DB: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-postgres}
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin123}
      # TLS is terminated by nginx, which sends X-Forwarded-* (not RFC 7239 Forwarded) headers
      KC_PROXY_HEADERS: xforwarded
      # Single-node deployment; avoids clustered cache discovery delays on restart
      KC_CACHE: local
    ports:
      - "127.0.0.1:8443:8443"
      # Plain HTTP, used by the TLS-terminating proxy on the same host
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      - postgres
    healthcheck:
      test: curl --head -fsSk https://localhost:9000/health/ready || exit 1

  postfix:
    build:
      context: postfix
      dockerfile: Dockerfile
    volumes:
      - ip_updater_logs:/var/logs/ip_updater/
    ports:
      - "127.0.0.1:225:25"
      - "127.0.0.1:8090:8090"  # Health check port
    healthcheck:
      test: postfix status
    environment:
      POSTFIX_MYHOSTNAME: ${POSTFIX_MYHOSTNAME:-localhost}
      POSTFIX_MYDOMAIN: ${POSTFIX_MYDOMAIN:-localhost}
      POSTFIX_MYNETWORKS: ${POSTFIX_MYNETWORKS:-172.17.0.0/24}
      POSTFIX_USERNAME: ${POSTFIX_USERNAME:-username}
      POSTFIX_PASSWORD: ${POSTFIX_PASSWORD:-password}
      POSTFIX_TLS_CRT_FILENAME: ${POSTFIX_SSL_CERT:-fullchain.pem}
      POSTFIX_TLS_KEY_FILENAME: ${POSTFIX_SSL_CERT_KEY:-privkey.pem}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-username}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-password}
      LDAP_USER: ${LDAP_USER:-ldap}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-password}
      LDAP_HOST: ${LDAP_HOST:-openldap}
      LDAP_PORT: ${LDAP_PORT:-389}
      # IP Updater Configuration
      ATLASSIAN_IP_JSON_URL: ${ATLASSIAN_IP_JSON_URL:-https://ip-ranges.atlassian.com/}
      DATADOG_API_KEY: ${DATADOG_API_KEY}
      DATADOG_APP_KEY: ${DATADOG_APP_KEY}
      DATADOG_SITE: ${DATADOG_SITE:-datadoghq.com}
      DATADOG_HOSTNAME: localhost.openmrs.org
      IP_CHECK_INTERVAL: ${IP_CHECK_INTERVAL:-3600}
      METRIC_REPORT_INTERVAL: ${METRIC_REPORT_INTERVAL:-300}
      # Health Check Service
      HEALTH_PORT: ${HEALTH_PORT:-8090}
volumes:
  postgres_data:
    driver: local
  ip_updater_logs:
    driver: local
