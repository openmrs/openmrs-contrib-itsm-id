services:
  db:
    # Must match the major version of the data in postgres_data; changing it requires a dump/restore.
    # Since PG18 the image keeps its data under /var/lib/postgresql/<major>/.
    image: postgres:18
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
    healthcheck:
      test: "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"

  keycloak:
    build:
      context: keycloak
      dockerfile: Dockerfile
    environment:
      # Either set KC_HOSTNAME to pin a single public URL, or leave it empty and set KC_HOSTNAME_STRICT=false
      # to answer on whichever hostname the proxy forwards.
      KC_HOSTNAME: ${KC_HOSTNAME:-}
      KC_HOSTNAME_STRICT: ${KC_HOSTNAME_STRICT:-true}
      KC_DB: postgres
      KC_DB_URL_DATABASE: ${POSTGRES_DB:-postgres}
      KC_DB_URL_HOST: db
      KC_DB_URL_PORT: 5432
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-Admin123}
      # TLS is terminated by nginx, which sends X-Forwarded-* (not RFC 7239 Forwarded) headers
      KC_PROXY_HEADERS: xforwarded
      # Single-node deployment; avoids clustered cache discovery delays on restart
      KC_CACHE: local
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    ports:
      - "127.0.0.1:8443:8443"
      # Plain HTTP, used by the TLS-terminating proxy on the same host
      - "127.0.0.1:8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      - db
    healthcheck:
      test: curl --head -fsSk https://localhost:9000/health/ready || exit 1

  postfix:
    build:
      context: postfix
      dockerfile: Dockerfile
    volumes:
      - ip_updater_logs:/var/logs/ip_updater/
    ports:
      - "127.0.0.1:225:25"
      - "127.0.0.1:8090:8090"  # Health check port
    healthcheck:
      test: postfix status
    environment:
      POSTFIX_MYHOSTNAME: ${POSTFIX_MYHOSTNAME:-localhost}
      POSTFIX_MYDOMAIN: ${POSTFIX_MYDOMAIN:-localhost}
      POSTFIX_MYNETWORKS: ${POSTFIX_MYNETWORKS:-172.17.0.0/24}
      POSTFIX_USERNAME: ${POSTFIX_USERNAME:-username}
      POSTFIX_PASSWORD: ${POSTFIX_PASSWORD:-password}
      POSTFIX_TLS_CRT_FILENAME: ${POSTFIX_SSL_CERT:-fullchain.pem}
      POSTFIX_TLS_KEY_FILENAME: ${POSTFIX_SSL_CERT_KEY:-privkey.pem}
      SMTP_SERVER: ${SMTP_SERVER:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-username}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-password}
      LDAP_USER: ${LDAP_USER:-ldap}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-password}
      LDAP_HOST: ${LDAP_HOST:-openldap}
      LDAP_PORT: ${LDAP_PORT:-389}
      # IP Updater Configuration
      ATLASSIAN_IP_JSON_URL: ${ATLASSIAN_IP_JSON_URL:-https://ip-ranges.atlassian.com/}
      DATADOG_API_KEY: ${DATADOG_API_KEY}
      DATADOG_APP_KEY: ${DATADOG_APP_KEY}
      DATADOG_SITE: ${DATADOG_SITE:-datadoghq.com}
      DATADOG_HOSTNAME: localhost.openmrs.org
      IP_CHECK_INTERVAL: ${IP_CHECK_INTERVAL:-3600}
      METRIC_REPORT_INTERVAL: ${METRIC_REPORT_INTERVAL:-300}
      # Health Check Service
      HEALTH_PORT: ${HEALTH_PORT:-8090}

  authentik-db-init:
    image: postgres:18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      AUTHENTIK_DB: ${AUTHENTIK_POSTGRES_DB:-authentik}
    command:
      - sh
      - -c
      - >-
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$$AUTHENTIK_DB'" | grep -q 1
        || psql -c "CREATE DATABASE \"$$AUTHENTIK_DB\""
    restart: "no"

  authentik-server:
    build:
      context: authentik
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY, see .env.template}
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${POSTGRES_USER:-postgres}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD:-Postgres123}
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    ports:
      # Admin UI only; nothing outside the host needs to reach authentik
      - "127.0.0.1:9000:9000"
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    shm_size: 512mb

  authentik-worker:
    build:
      context: authentik
    command: worker
    environment:
      <<: *authentik-env
      # Password for the akadmin user; only applied on the first start against an empty database
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:?set AUTHENTIK_BOOTSTRAP_PASSWORD, see .env.template}
      # The LDAP and full SCIM syncs each hold a thread while waiting for the page tasks they dispatch, so
      # authentik's default of 2 threads can deadlock when both run at once
      AUTHENTIK_WORKER__THREADS: ${AUTHENTIK_WORKER_THREADS:-4}
      # Read by authentik/blueprints/openmrs-atlassian-scim.yaml. docker-compose.override.yml points these at
      # local stand-ins for LDAP and Atlassian.
      AUTHENTIK_LDAP_URL: ${AUTHENTIK_LDAP_URL:-}
      AUTHENTIK_LDAP_BIND_DN: ${AUTHENTIK_LDAP_BIND_DN:-}
      AUTHENTIK_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      ATLASSIAN_SCIM_URL: ${ATLASSIAN_SCIM_URL:-}
      ATLASSIAN_SCIM_TOKEN: ${ATLASSIAN_SCIM_TOKEN:-}
      ATLASSIAN_EMAIL_DOMAIN: ${ATLASSIAN_EMAIL_DOMAIN:-}
      AUTHENTIK_SCIM_DRY_RUN: ${AUTHENTIK_SCIM_DRY_RUN:-true}
    depends_on:
      authentik-db-init:
        condition: service_completed_successfully
    shm_size: 512mb

volumes:
  postgres_data:
    driver: local
  ip_updater_logs:
    driver: local
