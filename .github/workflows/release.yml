name: Promote images to production

# Re-points :production at the images currently tagged :staging, without rebuilding, so production
# runs exactly what was tested on staging.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: promote-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - openmrsinfra/openmrs-id-keycloak
          - openmrsinfra/openmrs-id-postfix
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Tag :staging as :production
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker buildx imagetools create --tag "${IMAGE}:production" "${IMAGE}:staging"
          docker buildx imagetools inspect "${IMAGE}:production"
