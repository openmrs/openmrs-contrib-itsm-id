name: Keycloak image

on:
  push:
    branches: [main]
    paths:
      - "keycloak/**"
      - ".github/workflows/keycloak.yml"
  pull_request:
    paths:
      - "keycloak/**"
      - ".github/workflows/keycloak.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tag as <keycloak version>-<short sha>, taking the version from the final FROM line of the Dockerfile
      - name: Determine image version
        id: version
        run: |
          kc_version=$(grep -E '^FROM quay.io/keycloak/keycloak:' keycloak/Dockerfile | tail -n 1 | sed -E 's/^FROM [^:]+:([^ ]+).*/\1/')
          if [ -z "$kc_version" ]; then
            echo "Could not determine the Keycloak version from keycloak/Dockerfile" >&2
            exit 1
          fi
          echo "tag=${kc_version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: keycloak
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          # :staging is promoted to :production by the release workflow
          tags: |
            openmrsinfra/openmrs-id-keycloak:${{ steps.version.outputs.tag }}
            openmrsinfra/openmrs-id-keycloak:nightly
            openmrsinfra/openmrs-id-keycloak:staging
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak
