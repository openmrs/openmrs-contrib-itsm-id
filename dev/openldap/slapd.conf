include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema

modulepath /usr/lib/openldap
moduleload back_mdb.so

pidfile /run/openldap/slapd.pid

database mdb
suffix "dc=openmrs,dc=org"
directory /var/lib/openldap/openldap-data
maxsize 104857600

index objectClass eq
index uid,cn,member eq

# Mirrors production: the omrsid service account (used by Keycloak and authentik) can read and write the
# directory, users can bind with their own password, and nothing is readable anonymously.
access to attrs=userPassword
    by dn.exact="uid=omrsid,ou=system,dc=openmrs,dc=org" write
    by self write
    by anonymous auth
    by * none

access to *
    by dn.exact="uid=omrsid,ou=system,dc=openmrs,dc=org" write
    by self read
    by * none
